# docker-compose.prod.yml - Production only
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  warotickets:
    build:
      args:
        - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-https://api.warotickets.com}
        - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://warotickets.com}
        - NODE_ENV=production
    container_name: warotickets-prod
    env_file:
      - .env.prod
    restart: unless-stopped
