# docker-compose.override.yml - Development only
# This file is applied automatically when running: docker-compose up

services:
  warotickets:
    build:
      args:
        - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-https://dev.api.warotickets.com}
        - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL:-https://dev.warotickets.com}
        - NODE_ENV=development
    container_name: warotickets-dev
    ports:
      - "127.0.0.1:3004:3003"
    env_file:
      - .env.dev
